name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load the pinned build toolchain
        run: |
          for key in UV_VERSION BUILD_PYTHON; do
            if ! grep -m1 -E "^${key}=[0-9]+\.[0-9]+\.[0-9]+$" build-toolchain.env >> "$GITHUB_ENV"; then
              echo "::error::build-toolchain.env does not pin ${key}"
              exit 1
            fi
          done
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH with an optional a/b/rc suffix"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run pytest --cov
      - name: Build reproducible artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --python "$BUILD_PYTHON" --managed-python --build-constraints build-constraints.txt --require-hashes
          test -f "dist/elastic_migrate-${VERSION}-py3-none-any.whl"
          test -f "dist/elastic_migrate-${VERSION}.tar.gz"
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Pinned to a commit: the step receives OIDC and attestation write tokens.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "ElasticMigrate ${VERSION}")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" --notes "$(cat <<NOTES
          Changes: https://zobayer.net/elastic-migrate/changelog.html

          Every file is signed with the maintainer's OpenPGP key and carries a GitHub build provenance attestation.
          Verification steps: https://zobayer.net/elastic-migrate/downloads.html
          NOTES
          )"
